services:
  mongodb:
    image: mongo:7
    container_name: fullstack-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-appadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change_this_local_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-fullstack_app}
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: fullstack-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-appadmin}:${MONGO_INITDB_ROOT_PASSWORD:-change_this_local_password}@mongodb:27017/${MONGO_DATABASE:-fullstack_app}?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "5000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: fullstack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
